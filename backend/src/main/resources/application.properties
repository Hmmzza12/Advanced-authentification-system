spring.application.name=backend

# Server Configuration
server.port=8080

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:auth-db.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:REPLACE_WITH_SECURE_64_CHAR_HEX_STRING}
app.jwt.expirationMs=900000

# Rate Limiting Configuration
bucket4j.enabled=true

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:REPLACE_ME}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:REPLACE_ME}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/oauth2/callback/google

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:REPLACE_ME}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:REPLACE_ME}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8080/oauth2/callback/github

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:REPLACE_ME}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:REPLACE_ME}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=http://localhost:8080/oauth2/callback/facebook

app.oauth2.authorizedRedirectUris=http://localhost:5173/oauth2/redirect
